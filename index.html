<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff7f0">
  <meta name="description" content="ESP3 Mastery — English-first International Business theory, key terms, short answers, essays and exam practice for all 10 units.">
  <title>ESP3 Mastery · International Business</title>
  <link rel="icon" type="image/webp" href="assets/fly-neutral.webp">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#dashboard" aria-label="ESP3 Mastery home">
      <span class="brand-mark brand-fly"><img src="assets/fly-neutral.webp" alt="ESP3 fly mascot"></span>
      <span><strong>ESP3 Mastery</strong><small>International Business</small></span>
    </a>
    <nav class="desktop-nav" aria-label="Điều hướng chính">
      <a href="#learn">Theory in English</a>
      <a href="#flashcards">Flashcards</a>
      <a href="#practice">Short answers</a>
      <a href="#essay">Essay</a>
      <a href="#mock-test">Midterm test</a>

    <div class="header-actions">
      <button class="icon-btn" id="searchButton" aria-label="Tìm kiếm" title="Tìm kiếm (Ctrl/⌘ K)">⌕</button>

    </form>
    <label class="search-box"><span>⌕</span><input id="searchInput" type="search" placeholder="Ví dụ: comparative advantage, bill of exchange…" autocomplete="off"></label>
    <div id="searchResults" class="search-results"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
